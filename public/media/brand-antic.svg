  <!-- Right Wreath Branch -->
  <g transform="translate(312, 62)">
    <path d="M -12,32 C 18,22 32,-4 22,-32 C 16,-46 2,-56 -12,-60" fill="none" stroke="#2b3831" stroke-width="2.5" stroke-linecap="round"/>
    <use href="#antic-leaf-r" transform="translate(-10, 32) rotate(-42) scale(0.9)"/>
    <use href="#antic-leaf-r" transform="translate(0, 24) rotate(-32) scale(1.0)"/>
