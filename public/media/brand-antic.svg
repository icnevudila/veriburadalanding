    <!-- Letter t -->
    <path d="M 205,74 C 199,74 196,70 196,64 L 196,46 L 190,46 L 190,41 L 196,41 L 196,30 L 202,30 L 202,41 L 212,41 L 212,46 L 202,46 L 202,63 C 202,67 204,69 207,69 C 209,69 211,68 212,67 L 214,72 C 212,73 209,74 205,74 Z"/>

