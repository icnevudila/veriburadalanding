    <path d="M 124,76 C 114,76 107,69 107,58 C 107,46 115,39 126,39 C 136,39 143,46 143,58 L 143,74 L 138,74 L 138,69 C 135,74 130,76 124,76 Z M 125,45 C 118,45 113,50 113,58 C 113,65 118,70 125,70 C 132,70 137,65 137,58 C 137,50 132,45 125,45 Z"/>
    
    <!-- Letter n -->
