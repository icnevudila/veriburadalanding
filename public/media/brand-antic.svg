    <path d="M 221,74 L 221,41 L 227,41 L 227,74 Z M 224,34 C 221.8,34 220,32.2 220,30 C 220,27.8 221.8,26 224,26 C 226.2,26 228,27.8 228,30 C 228,32.2 226.2,34 224,34 Z"/>

    <!-- Letter c -->
    <path d="M 252,76 C 241,76 233,68 233,57.5 C 233,46.5 241,39 252,39 C 259,39 264,42 268,47 L 263,51 C 260,47 256,45 252,45 C 244,45 239,51 239,57.5 C 239,64 244,70 252,70 C 257,70 261,68 264,64 L 268,68 C 264,73 259,76 252,76 Z"/>
