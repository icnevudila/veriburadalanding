<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
    .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 38px; fill: #111827; letter-spacing: -1px; }
    .accent { fill: #10B981; }
  </style>
  <!-- Simple square bracket data icon -->
  <g transform="translate(6, 12)">
    <!-- Left bracket -->
    <path d="M0 0 L0 56 L12 56 L12 50 L6 50 L6 6 L12 6 L12 0 Z" class="accent"/>
    <!-- Three data lines -->
    <rect x="16" y="12" width="20" height="4" rx="2" class="accent"/>
    <rect x="16" y="24" width="14" height="4" rx="2" class="accent"/>
    <rect x="16" y="36" width="18" height="4" rx="2" class="accent"/>
    <!-- Right bracket -->
    <path d="M40 0 L52 0 L52 56 L40 56 L40 50 L46 50 L46 6 L40 6 Z" class="accent"/>
    <!-- Pin dot below -->
    <circle cx="26" cy="52" r="3" class="accent"/>
  </g>
  <!-- Wordmark -->
  <text x="72" y="50" class="brand">Veri Burada</text>
</svg>
